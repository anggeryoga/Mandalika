<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WhatsApp</title>
</head>
<body>

<button onclick="chatWA()">Bayar via WhatsApp</button>

<script>
function chatWA() {
    const phone = "6281337200766"; // Gunakan format internasional tanpa angka 0
    const message = "Hallo kak aku mau melakukan pembayaran Salut Mandalika";
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
}
</script>

</body>
</html>
